<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>aLw WebChat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0b0f19;
            color: #e6edf3;
            font-family: Arial, sans-serif;
        }

        .header {
            height: 55px;
            background: #111827;
            border-bottom: 1px solid #263244;
            display: flex;
            align-items: center;
            padding: 0 18px;
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            margin-left: auto;
            font-size: 12px;
            color: #00d4ff;
        }

        .chat {
            height: calc(100vh - 55px);
            display: flex;
            flex-direction: column;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
        }

        .message {
            margin-bottom: 9px;
            line-height: 1.5;
        }

        .time {
            color: #777;
            font-size: 11px;
            margin-right: 7px;
        }

        .nick {
            color: #00d4ff;
            font-weight: bold;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: #111827;
            border-top: 1px solid #263244;
        }

        #message {
            flex: 1;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0b0f19;
            color: white;
            outline: none;
        }

        button {
            margin-left: 8px;
            padding: 0 20px;
            border: 0;
            border-radius: 6px;
            background: #00d4ff;
            color: #061018;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="header">
    aLw WebChat
    <div class="status">● ONLINE</div>
</div>

<div class="chat">

    <div id="messages">

        <div class="message">
            <span class="time">13:00</span>
            <span class="nick">aLw</span>
            Selamat datang di aLw WebChat.
        </div>

        <div class="message">
            <span class="time">13:00</span>
            <span class="nick">aLw</span>
            WebChat berhasil berjalan di Node.js.
        </div>

    </div>

    <div class="input-area">
        <input
            id="message"
            type="text"
            placeholder="Ketik pesan..."
            autocomplete="off"
        >

        <button onclick="sendMessage()">Kirim</button>
    </div>

</div>

<script>
    const input = document.getElementById("message");
    const messages = document.getElementById("messages");

    function sendMessage() {
        const text = input.value.trim();

        if (!text) return;

        const now = new Date();

        const time =
            String(now.getHours()).padStart(2, "0") +
            ":" +
            String(now.getMinutes()).padStart(2, "0");

        const message = document.createElement("div");

        message.className = "message";

        message.innerHTML =
            `<span class="time">${time}</span>` +
            `<span class="nick">F4R1S</span> ` +
            escapeHtml(text);

        messages.appendChild(message);

        input.value = "";

        messages.scrollTop = messages.scrollHeight;
    }

    function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text;
        return div.innerHTML;
    }

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            sendMessage();
        }
    });
</script>

</body>
</html>
